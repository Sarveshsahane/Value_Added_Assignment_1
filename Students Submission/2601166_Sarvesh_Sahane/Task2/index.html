
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">


        <!-- This is the sidebar of the dashboard -->
        <aside class="sidebar">

            <div class="logo">
                <img src="/Task 2/Assets/17.png" alt="Student logo">
                <h2>Student<br>Portal</h2>
            </div>

            <nav class="menu">
                <a href="#" class="active">
                    <img src="/Task 2/Assets/13.png" alt="">
                    <span>Dashboard</span>
                </a>

                <a href="#">
                    <img src="/Task 2/Assets/14.png" alt="">
                    <span>Assignments</span>
                </a>

                <a href="#">
                    <img src="/Task 2/Assets/11.png" alt="">
                    <span>Courses</span>
                </a>

                <a href="#">
                    <img src="/Task 2/Assets/10.png" alt="">
                    <span>Progress</span>
                </a>

                <a href="#">
                    <img src="/Task 2/Assets/09.png" alt="">
                    <span>Profile</span>
                </a>
            </nav>

            <div class="logout">
                <a href="#">
                    <img src="/Task 2/Assets/08.png" alt="">
                    <span>Logout</span>
                </a>
            </div>

        </aside>

        <!-- This is the top navbar -->
        <main class="main-content">

            <!-- This is the top navbar -->
            <header class="topbar">
                <h1>Dashboard</h1>

                <div class="topbar-right">

                    <div class="notification">
                        <img src="/Task 2/Assets/16.png" alt="Notifications">
                    </div>

                    <div class="user-info">
                        <img src="/Task 2/Assets/15.png" alt="Profile picture">
                        <span>Sarvesh</span>
                        <p>V</p>
                    </div>

                </div>
            </header>

            <!-- This is the welcome banner -->
            <section class="welcome">

                <div class="welcome-text">
                    <h2>Welcome Back, Sarvesh! 👋</h2>
                    <p>Continue your learning journey and complete your pending assignments.</p>
                </div>

                <div class="welcome-image">
                    <img src="/Task 2/Assets/18.png" alt="Laptop and plant illustration">
                </div>

            </section>

            <!-- These cards show the student's overall details -->
            <section class="summary-cards">

                <div class="summary-card purple">
                    <img src="/Task 2/Assets/04.png" alt="Courses">
                    <div class="card-info">
                        <h3>3</h3>
                        <p>Courses</p>
                    </div>
                </div>

                <div class="summary-card green">
                    <img src="/Task 2/Assets/03.png" alt="Assignments">
                    <div class="card-info">
                        <h3>12</h3>
                        <p>Assignments</p>
                    </div>
                </div>

                <div class="summary-card yellow">
                    <img src="/Task 2/Assets/02.png" alt="Progress">
                    <div class="card-info">
                        <h3>78%</h3>
                        <p>Progress</p>
                    </div>
                </div>

                <div class="summary-card pink">
                    <img src="/Task 2/Assets/01.png" alt="Upcoming deadlines">
                    <div class="card-info">
                        <h3>5</h3>
                        <p>Due This Week</p>
                    </div>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
